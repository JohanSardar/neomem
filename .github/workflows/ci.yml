name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      every_feature:
        description: Re-prove every feature, not only the ones the last change touched
        type: boolean
        default: false
      feature:
        description: Re-prove only this feature
        type: string
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      - name: format
        run: cargo fmt --all --check
      - name: build
        run: cargo build --workspace --all-targets --locked
      - name: tests
        run: cargo nextest run --workspace --no-tests=pass
      - name: clippy (pedantic)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo-deny
        if: runner.os == 'Linux'
        run: cargo deny check
      - name: xtask check
        run: cargo xtask check
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: 24
      - name: agent CLIs for the install and recall proofs
        if: runner.os == 'Linux'
        run: npm install -g pnpm@12.14.0 @anthropic-ai/claude-code@2.1.304 @openai/codex@0.163.0 @earendil-works/pi-coding-agent@1.4.0
      - uses: actions/cache@v4
        if: runner.os == 'Linux'
        with:
          path: models
          key: models-${{ hashFiles('crates/neomem-control/src/model_files.rs') }}
      - name: a systemd user manager for the service proofs
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          runtime="/run/user/$(id -u)"
          for second in $(seq 1 30); do [ -S "$runtime/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$runtime/bus" >> "$GITHUB_ENV"
      - name: prove features
        if: runner.os == 'Linux'
        run: >-
          systemd-run --user --scope --quiet --property=Delegate=yes
          target/debug/neomemctl prove ${{ inputs.feature || (inputs.every_feature && '--all' || '--changed') }}
