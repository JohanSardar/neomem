[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/JohanSardar/neomem"
publish = false

[workspace.dependencies]
neomem-core = { path = "crates/neomem-core" }
neomem-proto = { path = "crates/neomem-proto" }
neomem-engine = { path = "crates/neomem-engine" }
neomem-state = { path = "crates/neomem-state" }
neomem-vault = { path = "crates/neomem-vault" }
neomem-index = { path = "crates/neomem-index" }
neomem-models = { path = "crates/neomem-models" }
neomem-testkit = { path = "crates/neomem-testkit" }
axum = "=0.8.9"
thiserror = "=2.0.21"
tokio = { version = "=1.54.0", features = ["rt-multi-thread", "net", "signal", "sync", "macros", "time"] }
toml = "=1.1.8"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
usearch = "=2.26.5"
ureq = { version = "=3.4.2", features = ["json"] }
sha2 = "=0.11.1"
llama-cpp-2 = { version = "=0.1.160", default-features = false }
anyhow = "=1.0.104"
arc-swap = "=1.9.3"
cargo_metadata = "=0.23.1"
clap = { version = "=4.6.7", features = ["derive"] }
notify = "=8.2.0"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
syn = { version = "=3.0.9", default-features = false, features = ["full", "parsing", "visit"] }
tempfile = "=3.27.0"
tiny_http = "=0.12.0"
half = "=2.7.1"
humantime = "=2.4.0"
jiff = "=0.2.38"
serde-saphyr = "=2.0.0"
ra_ap_rustc_lexer = { package = "ra-ap-rustc_lexer", version = "=0.178.0" }
walkdir = "=2.5.0"
form_urlencoded = "=1.2.2"
base64 = "=0.23.1"
getrandom = "=0.4.3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
print_stderr = "allow"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
