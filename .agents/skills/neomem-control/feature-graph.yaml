- id: daemon
  does: runs neomemd on the local socket and HTTP, checks the protocol version on every request, starts on demand and reports its status
  reached_via: [socket run/neomemd.sock, http POST /v1/request, neomem status]
  module: neomemd
  depends_on: []
  proof: daemon
  status: proven
  last_proof: proofs/daemon/2026-10-20T205225Z
- id: intake
  does: copies every intake record into the intake log with an int_ ID before any processing and queues its extraction job
  reached_via: [neomem add]
  module: neomem-engine (intake)
  depends_on: [daemon]
  proof: intake
  status: proven
  last_proof: proofs/intake/2026-10-20T205225Z
- id: spool
  does: writes capture signals and adds to spool/ while the daemon is down and drains them when it is back
  reached_via: [neomem add, neomem hook]
  module: neomem-cli (spool)
  depends_on: [intake]
  proof: spool
  status: planned
  last_proof: null
- id: raw
  does: keyword and date search over the raw intake log, without decay
  reached_via: [neomem raw]
  module: neomem-state (raw)
  depends_on: [intake]
  proof: raw
  status: planned
  last_proof: null
- id: correct
  does: marks an intake record as logged incorrectly, hides facts drawn only from it and queues them for re-checking
  reached_via: [neomem correct]
  module: neomem-engine (correct)
  depends_on: [intake]
  proof: correct
  status: planned
  last_proof: null
- id: vault
  does: keeps every fact and entity as a Markdown file with a YAML header, written atomically and committed to a local git repository with no remote
  reached_via: [daemon writer, daemon vault watcher]
  module: neomem-vault
  depends_on: [daemon]
  proof: vault
  status: proven
  last_proof: proofs/vault/2026-10-20T205225Z
- id: index
  does: keeps index.db and the in-memory snapshot (vectors, links, latest map, names) in step with the files and rebuilds them on demand
  reached_via: [neomem rebuild]
  module: neomem-index
  depends_on: [vault]
  proof: index
  status: planned
  last_proof: null
- id: drift
  does: the nightly drift check finds differences between the files and index.db and repairs them
  reached_via: [daemon nightly drift check]
  module: neomem-engine (drift)
  depends_on: [index]
  proof: drift
  status: planned
  last_proof: null
- id: models.embed
  does: embeds text locally with llama.cpp (Vulkan, CUDA, CPU or Metal) or any OpenAI-compatible embeddings endpoint, with a small query cache
  reached_via: [neomem models, neomem models test]
  module: neomem-models (embed)
  depends_on: [daemon]
  proof: models-embed
  status: planned
  last_proof: null
- id: models.judge
  does: typed decisions with probabilities from Jev, falling back to a local llama.cpp reranker when Jev is missing, slow or down
  reached_via: [neomem models test]
  module: neomem-models (judge)
  depends_on: [daemon]
  proof: models-judge
  status: planned
  last_proof: null
- id: models.llm
  does: structured completions from every provider kind (openai, anthropic, chatgpt, codex, command) with effort levels and one retry on invalid output
  reached_via: [neomem models test, neomem login]
  module: neomem-models (llm)
  depends_on: [daemon]
  proof: models-llm
  status: planned
  last_proof: null
- id: models.swap
  does: swapping the embedder re-embeds every memory into a second vector set in the background and switches search over in one step
  reached_via: [neomem models use]
  module: neomem-engine (reembed)
  depends_on: [models.embed, index]
  proof: models-swap
  status: planned
  last_proof: null
- id: models.idle
  does: unloads local models after 15 minutes without a search or recall and reloads them on the next use
  reached_via: [daemon model host]
  module: neomem-models (host)
  depends_on: [models.embed]
  proof: models-idle
  status: planned
  last_proof: null
- id: extract
  does: the worker batches intake (5 minutes of session silence, compaction or session end), extracts facts and entities with one model call and writes them through the writer
  reached_via: [daemon worker, neomem reextract]
  module: neomem-engine (worker)
  depends_on: [intake, vault, index, models.llm]
  proof: extract
  status: planned
  last_proof: null
- id: check
  does: checks each new fact against its 5 closest facts as same, extends, updates, contradicts or new, attaching evidence instead of duplicating
  reached_via: [daemon worker]
  module: neomem-engine (check)
  depends_on: [extract, models.judge]
  proof: check
  status: planned
  last_proof: null
- id: search
  does: the fixed search pipeline from query embedding through vector seeds, latest swap, one hop and ranking, with no model call besides the embedding
  reached_via: [neomem search]
  module: neomem-engine (search)
  depends_on: [index, models.embed]
  proof: search
  status: planned
  last_proof: null
- id: latest
  does: search only returns the newest version of a fact and puts the newer of two conflicting facts first, flagged
  reached_via: [neomem search]
  module: neomem-engine (search)
  depends_on: [search, check]
  proof: latest
  status: planned
  last_proof: null
- id: links
  does: adds useful linked facts and the entities a seed is about, scored without a model call
  reached_via: [neomem search]
  module: neomem-engine (search)
  depends_on: [search]
  proof: links
  status: planned
  last_proof: null
- id: history
  does: shows a fact's full update chain and answers as-of and include-invalid queries without decay
  reached_via: [neomem history, neomem search]
  module: neomem-engine (history)
  depends_on: [latest]
  proof: history
  status: planned
  last_proof: null
- id: entity
  does: shows an entity with aliases, facts, linked entities and external references, shows any memory file with its sources, and resolves names to entity IDs
  reached_via: [neomem entity, neomem show, neomem resolve]
  module: neomem-engine (entity)
  depends_on: [index]
  proof: entity
  status: planned
  last_proof: null
- id: decay
  does: ranks facts by ACT-R activation over evidence events, squashed into 0.3 to 1.5, with per-kind rates and an explicit useful signal
  reached_via: [neomem useful, neomem search]
  module: neomem-core (decay)
  depends_on: [search]
  proof: decay
  status: planned
  last_proof: null
- id: reconcile
  does: the fact reconciler settles conflicts, updates and duplicate facts with capped tool rounds and real source IDs only
  reached_via: [neomem dream, daemon consolidation trigger]
  module: neomem-engine (consolidation)
  depends_on: [check]
  proof: reconcile
  status: planned
  last_proof: null
- id: entities
  does: the entity keeper creates recurring entities, merges duplicates with aliases and merged_from, and records possibly_same
  reached_via: [neomem dream]
  module: neomem-engine (consolidation)
  depends_on: [reconcile]
  proof: entities
  status: planned
  last_proof: null
- id: capture.cc
  does: reads Claude Code transcripts from their stored position into one intake record per turn after a hook signal, folder change or sweep
  reached_via: [hook cc prompt, hook cc tool, hook cc stop, hook cc subagent-stop, hook cc compact, hook cc end]
  module: neomem-capture (claude code)
  depends_on: [intake]
  proof: capture-cc
  status: planned
  last_proof: null
- id: capture.codex
  does: reads Codex rollouts from their stored position, finding the file by session ID when the hook has no transcript path
  reached_via: [hook codex prompt, hook codex tool, hook codex stop, hook codex compact, hook codex end]
  module: neomem-capture (codex)
  depends_on: [intake]
  proof: capture-codex
  status: planned
  last_proof: null
- id: capture.pi
  does: reads pi session trees along the active branch after the extension's signals
  reached_via: [pi turn_end, pi agent_end, pi session_shutdown]
  module: neomem-capture (pi)
  depends_on: [intake]
  proof: capture-pi
  status: planned
  last_proof: null
- id: mcp
  does: serves the same tools over MCP on stdio (relayed to the daemon) and Streamable HTTP
  reached_via: [neomem mcp, http /mcp, mcp search, mcp add, mcp raw, mcp entity, mcp show, mcp history, mcp resolve, mcp tags, mcp link, mcp useful]
  module: neomemd (mcp)
  depends_on: [search, intake]
  proof: mcp
  status: planned
  last_proof: null
- id: skill
  does: the neomem skill teaches agents the command-line tool
  reached_via: [skill neomem]
  module: neomem-cli (skill)
  depends_on: [search]
  proof: skill
  status: planned
  last_proof: null
- id: install
  does: wires Claude Code, Codex and pi (plugin, pi package, skill, MCP) and the systemd or launchd service
  reached_via: [neomem install]
  module: neomem-cli (install)
  depends_on: [capture.cc, capture.codex, capture.pi, mcp, skill]
  proof: install
  status: planned
  last_proof: null
- id: recall.gate
  does: decides with the judge whether a turn needs memory; P >= 0.5 opens it
  reached_via: [neomem recall]
  module: neomem-engine (recall)
  depends_on: [search, models.judge]
  proof: recall-gate
  status: planned
  last_proof: null
- id: recall.plan
  does: rewrites the session slice into 3 to 5 fact-shaped queries, streamed, with model-free queries after 2.5 seconds
  reached_via: [neomem recall]
  module: neomem-engine (recall)
  depends_on: [models.llm]
  proof: recall-plan
  status: planned
  last_proof: null
- id: recall.approve
  does: searches every planned query, scores all candidates in one judge call, keeps P >= 0.7 and injects at most 5 never-injected memories within 3.5 seconds
  reached_via: [neomem recall]
  module: neomem-engine (recall)
  depends_on: [recall.gate, recall.plan]
  proof: recall-approve
  status: planned
  last_proof: null
- id: recall.hooks
  does: recall mode switched per agent or project, answered through the blocking prompt hooks and pi's before_agent_start, failing open
  reached_via: [neomem recall on, neomem recall off, hook cc prompt, hook codex prompt, pi before_agent_start]
  module: neomem-cli (hook)
  depends_on: [recall.approve, capture.cc, capture.codex, capture.pi]
  proof: recall-hooks
  status: planned
  last_proof: null
